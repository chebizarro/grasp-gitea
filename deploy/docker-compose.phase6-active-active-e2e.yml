services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grasp
      POSTGRES_PASSWORD: grasp-e2e
      POSTGRES_DB: grasp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grasp -d grasp"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  upstream:
    image: nginx:1.27-alpine
    volumes:
      - ${E2E_UPSTREAM_CONFIG:?set E2E_UPSTREAM_CONFIG}:/etc/nginx/conf.d/default.conf:ro

  bridge-a: &bridge
    platform: linux/amd64
    build:
      context: ..
      args:
        BUILD_TAGS: full
        GOPROXY: ${E2E_GOPROXY:-}
    image: ${GRASP_BRIDGE_IMAGE:-grasp-bridge:phase6-active-active-e2e}
    depends_on:
      postgres:
        condition: service_healthy
      upstream:
        condition: service_started
    environment: &bridge-environment
      GITEA_URL: http://upstream
      GITEA_ADMIN_TOKEN: phase6-e2e-admin-token
      GITEA_ADMIN_USER: e2e-admin
      CLONE_PREFIX: http://127.0.0.1:${E2E_NGINX_PORT:-58096}
      BRIDGE_PUBLIC_URL: http://127.0.0.1:${E2E_NGINX_PORT:-58096}
      RELAY_URLS: ""
      EMBEDDED_RELAY: "true"
      EMBEDDED_RELAY_PORT: "3334"
      EMBEDDED_RELAY_DB: /data/relay-db
      AUTH_ENABLED: "true"
      GITEA_FULL_PROXY_ENABLED: "true"
      GRASP_EDGE_SHARED_SECRET: 7vM9qL2pX8rT4nK6wB3cH5jF1sD0aG9uY2eR8iP4oN6mZ7xQ
      BRIDGE_TOKENS_ENABLED: "false"
      PROFILE_SYNC_ENABLED: "false"
      LISTEN: :8090
      DB_PATH: /data/mappings.db
      GRASP_CONFIG_PATH: /data/config.json
      POSTGRES_DSN: postgres://grasp:grasp-e2e@postgres:5432/grasp?sslmode=disable
      SIGNER_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - bridge-a-data:/data

  bridge-b:
    <<: *bridge
    environment:
      <<: *bridge-environment
    volumes:
      - bridge-b-data:/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      bridge-a:
        condition: service_healthy
      bridge-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${E2E_NGINX_PORT:-58096}:8080"
    volumes:
      - ${E2E_NGINX_CONFIG:?set E2E_NGINX_CONFIG}:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  bridge-a-data:
  bridge-b-data:
