# Local deployment E2E base. The runner combines this with the production
# hardening and full-proxy overlays so the test exercises the same image,
# mounts, secrets, and nginx routing used by the canonical deployment.
services:
  grasp-bridge:
    platform: linux/amd64
    build:
      context: ..
      args:
        BUILD_TAGS: full
        GOPROXY: ${E2E_GOPROXY:-}
    image: ${GRASP_BRIDGE_IMAGE:-grasp-bridge:phase1-e2e}
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_TOKEN: ${E2E_GITEA_ADMIN_TOKEN:-bootstrap-pending}
      GITEA_ADMIN_USER: e2e-admin
      CLONE_PREFIX: https://grasp.test
      BRIDGE_PUBLIC_URL: https://grasp.test
      GRASP_PUBLIC_URL: https://grasp.test
      RELAY_URLS: ""
      EMBEDDED_RELAY: "true"
      EMBEDDED_RELAY_PORT: "3334"
      EMBEDDED_RELAY_DB: /data/relay-db
      AUTH_ENABLED: "true"
      GITEA_FULL_PROXY_ENABLED: "true"
      BRIDGE_TOKENS_ENABLED: "false"
      GITEA_REPOSITORIES_PATH: /gitea-data/git/repositories
      LISTEN: :8090
      DB_PATH: /data/mappings.db
      GRASP_CONFIG_PATH: /data/config.json
      GRASP_ENV: production
      SIGNER_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    volumes:
      - grasp-bridge-data:/data
      - gitea-data:/gitea-data

  gitea:
    image: ${GITEA_IMAGE:-gitea/gitea:1.24.6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: grasp.test
      GITEA__server__ROOT_URL: https://grasp.test/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__server__LFS_JWT_SECRET: phase1-e2e-lfs-jwt-secret
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: phase1-e2e-secret-key
      GITEA__security__INTERNAL_TOKEN: 5f1fd22d1d8db62617a250eb77e5e326f33de7289965d45cf9ab94ef13649991
    volumes:
      - gitea-data:/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      grasp-bridge:
        condition: service_healthy
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ${E2E_NGINX_CONFIG:?set E2E_NGINX_CONFIG}:/etc/nginx/conf.d/default.conf:ro
      - ${E2E_TLS_CERT:?set E2E_TLS_CERT}:/etc/nginx/tls/tls.crt:ro
      - ${E2E_TLS_KEY:?set E2E_TLS_KEY}:/etc/nginx/tls/tls.key:ro

secrets:
  grasp-admin-api-token:
    file: ${GRASP_ADMIN_TOKEN_FILE:?set GRASP_ADMIN_TOKEN_FILE}
  grasp-credential-keys:
    file: ${GRASP_CREDENTIAL_KEYS_FILE:?set GRASP_CREDENTIAL_KEYS_FILE}
  grasp-edge-shared-secret:
    file: ${GRASP_EDGE_SECRET_FILE:?set GRASP_EDGE_SECRET_FILE}

volumes:
  grasp-bridge-data:
  grasp-hook-bin:
  gitea-data:
    name: ${E2E_GITEA_DATA_VOLUME:?set E2E_GITEA_DATA_VOLUME}
    external: true
